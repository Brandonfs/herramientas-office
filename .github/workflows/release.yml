name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar ejecutable
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/HerramientasOffice/HerramientasOffice.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:Version=$version -o out

      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          files: out/HerramientasOffice.exe
          generate_release_notes: true
